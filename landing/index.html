<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ayoo — loyalty that competes for you</title>
<meta name="description" content="Earn points anywhere, spend at partners. Venues compete on their points rate — up to 10× more. Free, in Telegram." />
<meta property="og:title" content="ayoo — loyalty that competes for you" />
<meta property="og:description" content="Earn points anywhere. Partners give up to 10× more. Free, in Telegram." />
<meta property="og:image" content="og.png" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4F0; --card:#FFFFFF; --ink:#000000;
    --orange:#ea5b0c; --blue:#273AA8; --teal:#1f71b8; --lilac:#B38BC8; --brown:#806828;
    --display:"Climate Crisis","Arial Black",Impact,sans-serif;
    --body:"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:64px}
  @media(min-width:721px){body{padding-bottom:0}}
  .wrap{max-width:1200px;margin:0 auto;padding:0 18px}
  .brd{border:3px solid var(--ink)}
  .up{text-transform:uppercase}
  a{color:inherit;text-decoration:none}
  button{font-family:var(--body);cursor:pointer}

  /* Header */
  header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:3px solid var(--ink)}
  .hrow{display:flex;align-items:center;gap:12px;padding:10px 18px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
  .brand{display:flex;align-items:center}
  .brand svg{height:40px;width:auto;display:block}
  .spacer{flex:1}
  .toggle{display:flex;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
  .toggle button{font-weight:900;font-size:12px;letter-spacing:1px;padding:9px 16px;background:var(--card);border:none;color:var(--ink)}
  .toggle button.on{background:var(--orange);color:#fff}
  .toggle button+button{border-left:3px solid var(--ink)}
  .langs{display:flex;gap:6px}
  .langs button{font-weight:900;font-size:11px;padding:7px 10px;background:var(--card);border:2px solid var(--ink);border-radius:6px;color:var(--ink)}
  .langs button.on{background:var(--ink);color:#fff}

  /* Pixel pet */
  .pet{display:grid;grid-template-columns:repeat(14,var(--px));line-height:0}
  .pet i{width:var(--px);height:var(--px);display:block}
  .icon-pet{--px:4px}
  .pet-icon{padding:5px;background:var(--card);border:2px solid var(--ink);border-radius:5px}

  /* Hero */
  .hero{padding:40px 0 24px}
  .kicker{font-size:13px;letter-spacing:3px;font-weight:900}
  h1{font-family:var(--display);font-weight:400;line-height:.92;letter-spacing:-2px;font-size:clamp(52px,12vw,180px);text-transform:uppercase;margin:12px 0}
  .sub{font-size:clamp(16px,2.2vw,24px);max-width:680px;line-height:1.25}
  .heroGrid{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
  .trust{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
  .trust span{font-size:12px;font-weight:900;letter-spacing:.5px;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:8px 14px}
  .cta{display:inline-block;margin-top:22px;font-family:var(--display);font-size:clamp(18px,2.4vw,26px);background:var(--ink);color:#fff;padding:18px 32px;border-radius:10px;border:3px solid var(--ink)}
  .cta.alt{background:var(--orange);color:#fff}

  /* Mock Member Pass */
  .pass{width:300px;border:3px solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 var(--ink);overflow:hidden;background:var(--orange)}
  .passTop{padding:16px 16px 10px;position:relative;min-height:200px;display:flex;flex-direction:column;justify-content:space-between}
  .passLbl{font-size:10px;letter-spacing:2px;font-weight:900;color:rgba(0,0,0,.62)}
  .passPts{font-family:var(--display);font-size:64px;line-height:.85;color:#000}
  .passPetRow{display:flex;justify-content:flex-end}
  .passPet{--px:6px}
  .dot{position:absolute;width:14px;height:14px;background:rgba(0,0,0,.12)}
  .perf{display:flex;align-items:center;height:22px;background:var(--orange);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
  .perf .d{flex:1;height:2px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 6px,transparent 6px 10px)}
  .passBot{background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .bc{display:flex;gap:2px;height:34px}.bc i{background:#000;display:block}
  .passBtn{background:var(--teal);color:#fff;border:2px solid #000;border-radius:6px;text-align:center;font-weight:900;font-size:12px;letter-spacing:1px;padding:9px}

  /* Social proof strip */
  .proof{border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);background:var(--card)}
  .proofIn{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;max-width:1200px;margin:0 auto;font-weight:900;font-size:14px}
  .proof .city{background:var(--lilac);border:2px solid #000;border-radius:99px;padding:6px 14px;font-size:13px}
  .proof .pr{background:var(--bg);border:2px solid #000;border-radius:8px;padding:6px 12px;font-size:13px}

  section{padding:34px 0}
  .secHead{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,68px);text-transform:uppercase;letter-spacing:-1px;line-height:.95;margin-bottom:20px}

  /* Compare 2 vs 20 */
  .compare{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
  .vs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .vs .v{font-family:var(--display);font-size:clamp(22px,3vw,34px)}
  .vsTag{background:var(--orange);color:#fff;border:3px solid #000;border-radius:99px;padding:8px 16px;font-weight:900;font-size:13px;white-space:nowrap}
  .cmpCard{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:8px 8px 0 var(--ink);padding:22px;text-align:center}
  .cmpCard.win{background:var(--orange)}
  .cmpCard .cap{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:rgba(0,0,0,.55)}
  .cmpCard .num{font-family:var(--display);font-size:clamp(56px,12vw,120px);line-height:.85;margin:8px 0}
  .cmpCard .u{font-size:14px;font-weight:900}
  .cmpNote{text-align:center;margin-top:14px;font-size:14px}
  @media(max-width:640px){.compare{grid-template-columns:1fr}.vs{flex-direction:row}}

  /* Calculator */
  .calc{background:var(--ink);color:#fff;border-radius:16px;padding:28px}
  .calc h3{font-family:var(--display);font-weight:400;font-size:clamp(24px,4vw,40px);text-transform:uppercase}
  .calc .lab{font-size:13px;font-weight:900;letter-spacing:1px;margin:18px 0 10px;color:#bbb}
  .calc .val{font-family:var(--display);font-size:clamp(30px,6vw,54px);color:var(--orange)}
  input[type=range]{-webkit-appearance:none;width:100%;height:14px;background:#333;border-radius:99px;outline:none;margin:14px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:8px;background:var(--orange);border:3px solid #fff;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:8px;background:var(--orange);border:3px solid #fff;cursor:pointer}
  .calcOut{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .calcOut .o{background:#1a1a1a;border:2px solid #444;border-radius:12px;padding:16px}
  .calcOut .o.win{border-color:var(--orange);background:#241200}
  .calcOut .cap{font-size:11px;color:#aaa;font-weight:900;letter-spacing:1px;text-transform:uppercase}
  .calcOut .big{font-family:var(--display);font-size:clamp(28px,6vw,46px);margin-top:6px}
  .calcOut .o.win .big{color:var(--orange)}
  .calcMult{text-align:center;margin-top:16px;font-weight:900;font-size:16px}

  /* Cards / chips */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .card{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:22px;box-shadow:8px 8px 0 var(--ink)}
  .card .big{font-family:var(--display);font-size:clamp(40px,7vw,72px);line-height:.9;color:var(--orange)}
  .card .ct{font-size:15px;margin-top:12px;line-height:1.3}
  .card.b1{background:var(--orange)} .card.b1 .big{color:#000}
  .card.b2{background:var(--lilac)} .card.b2 .big{color:#000}
  .card.b3{background:var(--teal)} .card.b3 .big{color:#fff} .card.b3 .ct{color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:12px}
  .chip{background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:14px 18px;font-size:16px;box-shadow:5px 5px 0 var(--ink)}
  .collRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}

  /* How */
  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .step .n{font-family:var(--display);font-size:clamp(64px,12vw,140px);line-height:.85;color:var(--orange)}
  .step .tx{font-size:16px;margin-top:8px;max-width:280px;line-height:1.3}

  /* Partner form */
  .lead{background:var(--lilac);border:3px solid var(--ink);border-radius:16px;box-shadow:10px 10px 0 var(--ink);padding:28px}
  .lead h3{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,48px);text-transform:uppercase;line-height:.95}
  .lead p{margin-top:8px;font-size:15px}
  .lead .f{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;margin-top:18px}
  .lead input{font-family:var(--body);font-weight:700;font-size:16px;padding:14px;border:3px solid #000;border-radius:8px;background:#fff;color:#000}
  .lead .sub{background:var(--ink);color:#fff;border:3px solid #000;border-radius:8px;font-family:var(--display);font-size:18px;padding:0 24px}
  .leadOk{margin-top:16px;background:#fff;border:3px solid #000;border-radius:8px;padding:14px;font-weight:900;display:none}
  @media(max-width:640px){.lead .f{grid-template-columns:1fr}}

  /* FAQ */
  .faq{display:grid;gap:12px}
  .qa{background:var(--card);border:3px solid var(--ink);border-radius:12px;overflow:hidden}
  .qa summary{list-style:none;cursor:pointer;padding:18px 20px;font-weight:900;font-size:17px;display:flex;justify-content:space-between;gap:14px}
  .qa summary::-webkit-details-marker{display:none}
  .qa summary::after{content:"+";font-family:var(--display);font-size:24px}
  .qa[open] summary::after{content:"–"}
  .qa .a{padding:0 20px 18px;font-size:15px;line-height:1.4}

  /* Footer */
  .foot{background:var(--ink);color:#fff;border-radius:16px;padding:40px 26px;text-align:center;margin:30px 0}
  .foot h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,80px);text-transform:uppercase;line-height:.95}
  .foot .cta{background:#fff;color:#000;border-color:#fff;margin-top:22px}
  .barcode{display:flex;gap:3px;height:46px;justify-content:center;margin-top:26px;opacity:.9}
  .barcode i{background:#fff;display:block}
  .legal{font-size:11px;color:#888;padding:24px 0 40px;text-align:center;letter-spacing:1px}

  /* Sticky mobile CTA */
  .sticky{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-top:3px solid var(--ink);padding:10px 14px;display:flex}
  .sticky a{flex:1;text-align:center;font-family:var(--display);font-size:18px;background:var(--orange);color:#fff;border:3px solid #000;border-radius:10px;padding:12px}
  @media(min-width:721px){.sticky{display:none}}
  @media(max-width:720px){.how{grid-template-columns:1fr}.heroGrid{grid-template-columns:1fr}.pass{justify-self:start}}
</style>
</head>
<body>

    </div>

</header>

<main>
  <div class="wrap hero">
    <div class="heroGrid">
      <div>
        <div class="kicker" id="kicker"></div>
        <h1 id="hero"></h1>
        <p class="sub" id="sub"></p>
        <div class="trust" id="trust"></div>
        <a class="cta" id="cta" href="#" target="_blank" rel="noopener"></a>
      </div>
      <!-- Mock Member Pass -->
      <div class="pass">
        <div class="passTop" id="passTop">
          <div>
            <div class="passLbl">MEMBER PASS</div>
            <div class="passPts">2,480</div>
          </div>
          <div class="passPetRow"><div class="pet passPet" data-pet data-key="FOX"></div></div>
        </div>
        <div class="perf"><span style="width:14px"></span><span class="d"></span><span style="width:14px"></span></div>
        <div class="passBot">
          <div class="bc" id="passBc"></div>
          <div class="passBtn" data-k="passScan">SCAN RECEIPT</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Social proof -->
  <div class="proof"><div class="proofIn">
    <span class="city" id="proofCity"></span>
    <span class="pr">Café Willow</span><span class="pr">Hi Food</span><span class="pr">JAN</span>
  </div></div>

  <!-- Compare 2 vs 20 -->
  <section class="wrap">
    <div class="secHead" id="cmpHead"></div>

const TG = "https://t.me/ayoo_loyalty_bot";
const SCAN_RATE = 0.001, PARTNER_RATE = 0.01; // 1pt/1000 RSD vs 10×

let state = { role: localStorage.getItem("ayoo_role")||"client", lang: localStorage.getItem("ayoo_lang")||"en" };

function paint(el,key,frame){
  const rows=(S[key]||S.HATCHLING)[frame]||(S[key]||S.HATCHLING)[0];let h="";
  for(const r of rows)for(const ch of r)h+='<i style="background:'+(ch==="K"?"#1A1208":"transparent")+'"></i>';
  el.innerHTML=h;
}
const fmt=n=>Math.round(n).toLocaleString();

function calc(){
  const L=T[state.lang];const spend=+document.getElementById("calcRange").value;
  document.getElementById("calcVal").textContent=spend.toLocaleString();
  const scan=spend*SCAN_RATE, part=spend*PARTNER_RATE;
  document.getElementById("calcScan").textContent=fmt(scan);
  document.getElementById("calcPart").textContent=fmt(part);
  document.getElementById("calcMult").textContent=L.calcMult(Math.round(part/Math.max(scan,0.0001)));
}

function render(){
  const L=T[state.lang], R=L[state.role];
  document.querySelectorAll("#roleToggle button").forEach(b=>b.classList.toggle("on",b.dataset.role===state.role));
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===state.lang));
  document.documentElement.lang=state.lang;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  document.querySelector('[data-k="nav_client"]').textContent=L.nav_client;
  document.querySelector('[data-k="nav_partner"]').textContent=L.nav_partner;
  document.querySelector('[data-k="passScan"]').textContent=L.passScan;
  // hero
  set("kicker",R.kicker); set("hero",R.hero); set("sub",R.sub);
  document.getElementById("trust").innerHTML=R.trust.map(t=>"<span>"+t+"</span>").join("");
  const cta=document.getElementById("cta"); cta.textContent=R.cta; cta.href=TG; cta.classList.toggle("alt",state.role==="partner");
  // proof
  set("proofCity",L.proofCity);
  // compare
  set("cmpHead",L.cmpHead); set("cmpScanCap",L.cmpScanCap); set("cmpPartCap",L.cmpPartCap);
  set("cmpU1",L.cmpU1); set("cmpU2",L.cmpU2); set("cmpTag",L.cmpTag); set("cmpNote",L.cmpNote);
  // calc
  set("calcHead",L.calcHead); set("calcLab",L.calcLab); set("calcUnit",L.calcUnit);
  set("calcScanCap",L.calcScanCap); set("calcPartCap",L.calcPartCap); calc();
  // benefits
  set("benHead",R.benHead);
  document.getElementById("benefits").innerHTML=R.benefits.map((b,i)=>'<div class="card '+["b1","","b2","b3"][i%4]+'"><div class="big">'+b[0]+'</div><div class="ct">'+b[1]+'</div></div>').join("");
  // game
  set("gameHead",R.gameHead);
  document.getElementById("game").innerHTML=R.game.map(g=>'<div class="chip">'+g+'</div>').join("");
  document.getElementById("collRow").innerHTML=COLLECTION.map(k=>'<div class="pet-icon"><div class="pet icon-pet" data-pet data-key="'+k+'"></div></div>').join("");
  // lead form (partner only)
  const leadSec=document.getElementById("leadSec");
  if(state.role==="partner"){
    leadSec.style.display="";
    set("leadHead",R.leadHead); set("leadSub",R.leadSub);
    document.getElementById("lf_name").placeholder=R.lfName;
    document.getElementById("lf_contact").placeholder=R.lfContact;
    document.getElementById("lf_btn").textContent=R.lfBtn;
    document.getElementById("leadOk").textContent=R.leadOk;
    document.getElementById("leadOk").style.display="none";
  } else leadSec.style.display="none";
  // how
  set("howHead",L.howHead);
  document.getElementById("how").innerHTML=L.how.map(s=>'<div class="step"><div class="n">'+s[0]+'</div><div class="tx">'+s[1]+'</div></div>').join("");
  // faq
  set("faqHead",L.faqHead);
  document.getElementById("faq").innerHTML=R.faq.map(q=>'<details class="qa"><summary>'+q[0]+'</summary><div class="a">'+q[1]+'</div></details>').join("");
  // footer + sticky
  set("footTitle",L.footTitle);
  const fc=document.getElementById("footCta"); fc.textContent=R.cta; fc.href=TG; fc.classList.toggle("alt",state.role==="partner");
  const sc=document.getElementById("stickyCta"); sc.textContent=R.cta; sc.href=TG;

function tick(force){
  if(!force){frame=1-frame;ticks++;}
  document.querySelectorAll("[data-pet]").forEach(el=>paint(el,el.dataset.key,frame));
}

document.getElementById("leadForm").addEventListener("submit",e=>{
  e.preventDefault();
  const lead={name:document.getElementById("lf_name").value,contact:document.getElementById("lf_contact").value,t:Date.now()};
  try{const all=JSON.parse(localStorage.getItem("ayoo_leads")||"[]");all.push(lead);localStorage.setItem("ayoo_leads",JSON.stringify(all));}catch(_){}
  document.getElementById("leadOk").style.display="block";
  e.target.reset();
});

render();
</script>
</body>
</html>
